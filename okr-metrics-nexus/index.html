<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKR & Metrics Nexus — Strategic Alignment Command Center | Santoshanand Adkar Ecosystem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header-banner {
      background: linear-gradient(90deg, #0f172a, #1e1b4b);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .header-banner .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .header-banner .brand-title {
      color: #38bdf8;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }
    .header-banner .return-btn {
      padding: 8px 18px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
    }
    .header-banner .return-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
    }
    .app-layout {
      max-width: 1200px;
      width: 92%;
      margin: 30px auto;
      flex: 1;
    }
    .hero-section {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .hero-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
    }
    .hero-icon {
      font-size: 40px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }
    .hero-sub {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 6px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .nav-tab {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .nav-tab.active, .nav-tab:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .app-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .app-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      color: #fff;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-status {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-status.active {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .action-btn {
      margin-top: 16px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <header class="header-banner">
    <div class="brand">
      <span>&#9889; Santoshanand Adkar Master Ecosystem</span>
      <span style="opacity:0.4;">|</span>
      <span class="brand-title">Enterprise OKR & Strategic Alignment Engine</span>
    </div>
    <a href="../index.html" class="return-btn">
      <span>&#127968;</span> Return to Main Portfolio
    </a>
  </header>

  <main class="app-layout">
    <section class="hero-section">
      <div class="hero-top">
        <div class="hero-icon">&#127919;</div>
        <div class="hero-title">
          <span class="badge">Strategic OKR</span>
          <h1>Enterprise OKR & Strategic Alignment Engine</h1>
        </div>
      </div>
      <p class="hero-sub">Connect executive strategic objectives directly to squad Key Results and quantitative delivery KPIs.</p>
    </section>

    <nav class="nav-tabs">
      <button class="nav-tab" id="tab-btn-okrs" onclick="switchTab('okrs')">&#127919; Strategic OKRs</button>
<button class="nav-tab" id="tab-btn-kpis" onclick="switchTab('kpis')">&#128200; Squad KPI Matrix</button>
<button class="nav-tab" id="tab-btn-tree" onclick="switchTab('tree')">&#127795; Alignment Tree</button>

    </nav>

    <section id="app-content">
      <!-- Dynamic interactive tab content rendered by JS -->
    </section>
  </main>

  <script>
    
        function renderTab(tabId) {
          const content = document.getElementById('app-content');
          if (tabId === 'okrs') {
            content.innerHTML = `
              <div class="card-grid">
                <div class="app-card">
                  <div class="card-status active">Q3 TARGET</div>

                  <p style="color:#94a3b8; font-size:13px;">Enable 100% of engineering squads with GenAI coding tools and automated testing pipelines.</p>
                  <div style="margin-top:15px;">
                    <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
                      <span>Progress</span> <strong>78%</strong>
                    </div>
                    <div style="height:8px; background:#1e293b; border-radius:4px; overflow:hidden;">
                      <div style="width:78%; height:100%; background:linear-gradient(90deg,#6366f1,#38bdf8);"></div>
                    </div>
                  </div>
                  <ul style="color:#cbd5e1; font-size:13px; margin-top:12px; padding-left:16px; line-height:1.6;">
                    <li>KR 1: Onboard 450 engineers to Cursor AI (Progress: 85%)</li>
                    <li>KR 2: Reduce regression test cycle time by 40% (Progress: 70%)</li>
                  </ul>
                </div>

                <div class="app-card">
                  <div class="card-status active">Q3 TARGET</div>
                  <h3>Objective 2: Elevate PBWM Banking Platform Reliability</h3>
                  <p style="color:#94a3b8; font-size:13px;">Achieve 99.99% system availability across Wealth and Credit APIs.</p>
                  <div style="margin-top:15px;">
                    <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
                      <span>Progress</span> <strong>92%</strong>
                    </div>
                    <div style="height:8px; background:#1e293b; border-radius:4px; overflow:hidden;">
                      <div style="width:92%; height:100%; background:linear-gradient(90deg,#22c55e,#38bdf8);"></div>
                    </div>
                  </div>
                  <ul style="color:#cbd5e1; font-size:13px; margin-top:12px; padding-left:16px; line-height:1.6;">
                    <li>KR 1: Zero Severity-1 incidents in Production (Progress: 100%)</li>
                    <li>KR 2: MTTR under 15 minutes (Progress: 84%)</li>
                  </ul>
                </div>
              </div>
            `;
          } else if (tabId === 'kpis') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#128200;</span> Squad KPI Performance Dashboard</h3>
                <div style="overflow-x:auto; margin-top:15px;">
                  <table style="width:100%; border-collapse:collapse; text-align:left; font-size:14px;">
                    <thead>
                      <tr style="border-bottom:1px solid #334155; color:#38bdf8;">
                        <th style="padding:10px;">Squad Name</th>
                        <th style="padding:10px;">Velocity</th>
                        <th style="padding:10px;">Cycle Time</th>
                        <th style="padding:10px;">Flow Efficiency</th>
                        <th style="padding:10px;">Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr style="border-bottom:1px solid #1e293b;">
                        <td style="padding:10px; font-weight:600;">Payments Alpha</td>
                        <td style="padding:10px;">52 pts</td>
                        <td style="padding:10px;">2.4 days</td>
                        <td style="padding:10px;">74%</td>
                        <td style="padding:10px; color:#22c55e;">High Flow</td>
                      </tr>
                      <tr style="border-bottom:1px solid #1e293b;">
                        <td style="padding:10px; font-weight:600;">Wealth Cyber Sentinel</td>
                        <td style="padding:10px;">68 pts</td>
                        <td style="padding:10px;">1.8 days</td>
                        <td style="padding:10px;">82%</td>
                        <td style="padding:10px; color:#22c55e;">High Flow</td>
                      </tr>
                      <tr style="border-bottom:1px solid #1e293b;">
                        <td style="padding:10px; font-weight:600;">Credit Decision Engine</td>
                        <td style="padding:10px;">44 pts</td>
                        <td style="padding:10px;">4.1 days</td>
                        <td style="padding:10px;">58%</td>
                        <td style="padding:10px; color:#eab308;">Needs Optimization</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            `;
          } else if (tabId === 'tree') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#127795;</span> Enterprise Goal Hierarchy Tree</h3>
                <div style="background:#020617; border:1px solid #1e293b; padding:20px; border-radius:12px; font-family:sans-serif; margin-top:15px;">
                  <div style="color:#38bdf8; font-weight:700;">[Company Strategy 2026]: Global Tech & Banking Modernization</div>
                  <div style="padding-left:20px; border-left:2px solid #334155; margin-top:10px;">
                    <div style="color:#818cf8; font-weight:600;">&#8627; [PBWM Business Unit]: Digital Wealth & Credit Innovation</div>
                    <div style="padding-left:20px; border-left:2px solid #334155; margin-top:8px;">
                      <div style="color:#cbd5e1;">&#8627; [Agile Release Train]: Wealth Infrastructure ART</div>
                      <div style="color:#94a3b8; font-size:13px; padding-left:20px;">&#8627; Squad Alpha, Squad Beta, Squad Gamma</div>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }
        }
        

    function switchTab(tabId) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const activeBtn = document.getElementById('tab-btn-' + tabId);
      if (activeBtn) activeBtn.classList.add('active');
      renderTab(tabId);
    }

    // Default to first tab
    document.addEventListener('DOMContentLoaded', () => {
      const firstTab = 'okrs';
      switchTab(firstTab);
    });
  </script>
</body>
</html>
