version: '3.8'

services:
  agilesecops-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agilesecops-sentinel-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/repos"]
      interval: 30s
      timeout: 10s
      retries: 3
