name: DevSecOps CI/CD & Production Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Syntax & Import Verification
        run: |
          python -c "import backend.main; print('Backend loaded cleanly!')"

      - name: Run Live Case Study Verification Test
        run: |
          python test_case_study.py

      - name: Build Docker Production Image
        run: |
          docker build -t agilesecops-sentinel:latest .
