<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse - Productivity & Task Manager</title>
    <meta name="description" content="A modern full-stack task and milestone management application with Python FastAPI and PostgreSQL/SQLite database storage.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="logo-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1>TaskPulse</h1>
                    <p class="subtitle">Full-Stack CI/CD Demo Application</p>
                </div>
            </div>
            <div class="header-badges">
                <span class="status-badge live-badge">
                    <span class="pulse-dot"></span> Live DB
                </span>
                <span class="status-badge api-badge">
                    <i class="fa-solid fa-code"></i> FastAPI 1.0
                </span>
            </div>
        </header>

        <!-- Stats Cards Grid -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon icon-blue"><i class="fa-solid fa-list-check"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-amber"><i class="fa-solid fa-clock"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value" id="stat-pending">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-green"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="stat-completed">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-purple"><i class="fa-solid fa-chart-line"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Completion Rate</span>
                    <span class="stat-value" id="stat-rate">0%</span>
                </div>
            </div>
        </section>

        <!-- Main Task Area -->
        <main class="main-content">
            <!-- Left Panel: Create Task Form -->
            <section class="card form-card">
                <h2><i class="fa-solid fa-plus-circle"></i> Create New Task</h2>
                <form id="create-task-form">
                    <div class="form-group">
                        <label for="task-title">Task Title *</label>
                        <input type="text" id="task-title" placeholder="e.g., Build CI/CD pipeline script" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" rows="3" placeholder="Add detailed notes or requirements..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-priority">Priority</label>
                            <select id="task-priority">
                                <option value="High">🔴 High Priority</option>
                                <option value="Medium" selected>🟡 Medium Priority</option>
                                <option value="Low">🟢 Low Priority</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="task-category">Category</label>
                            <select id="task-category">
                                <option value="DevOps">🚀 DevOps / CI-CD</option>
                                <option value="Backend" selected>🐍 Backend API</option>
                                <option value="Frontend">🎨 Frontend</option>
                                <option value="Database">🗄️ Database</option>
                                <option value="General">📌 General</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> Add Task to Database
                    </button>
                </form>
            </section>

            <!-- Right Panel: Task List & Filters -->
            <section class="card tasks-card">
                <div class="tasks-header">
                    <h2><i class="fa-solid fa-tasks"></i> Task Queue</h2>
                    <div class="filter-tabs">
                        <button class="tab-btn active" data-filter="all">All</button>
                        <button class="tab-btn" data-filter="pending">Pending</button>
                        <button class="tab-btn" data-filter="completed">Completed</button>
                    </div>
                </div>

                <!-- Priority Filter & Search -->
                <div class="filter-bar">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Search tasks...">
                    </div>
                    <select id="priority-filter">
                        <option value="All">All Priorities</option>
                        <option value="High">High Priority</option>
                        <option value="Medium">Medium Priority</option>
                        <option value="Low">Low Priority</option>
                    </select>
                </div>

                <!-- Task List Items -->
                <div class="task-list" id="task-list">
                    <!-- Dynamic tasks rendered via JS -->
                    <div class="empty-state">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <p>Loading database tasks...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>TaskPulse Full-Stack App • Built with FastAPI, SQLite/PostgreSQL & GitHub Actions CI/CD pipeline</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
