name: TaskPulse CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Code Linting Check (Ruff)
        run: |
          ruff check .

      - name: 5. Execute Automated Test Suite (Pytest)
        run: |
          pytest -v tests/

  deploy-to-production:
    name: Production Deployment Trigger
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy Status Notification
        run: |
          echo "✅ CI/CD Pipeline Passed All Tests!"
          echo "🚀 Triggering automatic production deployment to cloud web service..."
