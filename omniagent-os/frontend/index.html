<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAgent OS — Multi-Agent Orchestration Studio | Santoshanand Adkar Ecosystem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header-banner {
      background: linear-gradient(90deg, #0f172a, #1e1b4b);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .header-banner .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .header-banner .brand-title {
      color: #38bdf8;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }
    .header-banner .return-btn {
      padding: 8px 18px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
    }
    .header-banner .return-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
    }
    .app-layout {
      max-width: 1200px;
      width: 92%;
      margin: 30px auto;
      flex: 1;
    }
    .hero-section {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .hero-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
    }
    .hero-icon {
      font-size: 40px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }
    .hero-sub {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 6px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .nav-tab {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .nav-tab.active, .nav-tab:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .app-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .app-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      color: #fff;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-status {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-status.active {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .action-btn {
      margin-top: 16px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <header class="header-banner">
    <div class="brand">
      <span>&#9889; Santoshanand Adkar Master Ecosystem</span>
      <span style="opacity:0.4;">|</span>
      <span class="brand-title">Autonomous Multi-Agent Workflow Studio</span>
    </div>
    <a href="../../index.html" class="return-btn">
      <span>&#127968;</span> Return to Main Portfolio
    </a>
  </header>

  <main class="app-layout">
    <section class="hero-section">
      <div class="hero-top">
        <div class="hero-icon">&#129302;</div>
        <div class="hero-title">
          <span class="badge">Multi-Agent AI</span>
          <h1>Autonomous Multi-Agent Workflow Studio</h1>
        </div>
      </div>
      <p class="hero-sub">Orchestrate specialized AI agents, manage MCP tools, and monitor human-in-the-loop task execution.</p>
    </section>

    <nav class="nav-tabs">
      <button class="nav-tab" id="tab-btn-agents" onclick="switchTab('agents')">&#129302; Agent Fleet</button>
<button class="nav-tab" id="tab-btn-dag" onclick="switchTab('dag')">&#128451; Workflow DAG Visualizer</button>
<button class="nav-tab" id="tab-btn-hitl" onclick="switchTab('hitl')">&#9995; Human-in-the-Loop Queue</button>
<button class="nav-tab" id="tab-btn-chat" onclick="switchTab('chat')">&#128172; Multi-Agent Chat Console</button>

    </nav>

    <section id="app-content">
      <!-- Dynamic interactive tab content rendered by JS -->
    </section>
  </main>

  <script>
    
        function renderTab(tabId) {
          const content = document.getElementById('app-content');
          if (tabId === 'agents') {
            content.innerHTML = `
              <div class="card-grid">
                <div class="app-card">
                  <div class="card-status active">ACTIVE</div>
                  <h3><span>&#128373;</span> Architect Agent (Pro)</h3>
                  <p>Decomposes complex enterprise prompts into structured sub-tasks and JSON execution DAGs.</p>

                  <div class="metric-row"><span>Tokens Processed:</span> <strong>142,890</strong></div>
                  <div class="metric-row"><span>Success Rate:</span> <strong>99.4%</strong></div>
                  <button class="action-btn" onclick="alert('Invoking Architect Agent...')">Invoke Agent</button>
                </div>
                <div class="app-card">
                  <div class="card-status active">ACTIVE</div>
                  <h3><span>&#128187;</span> Code Synthesizer Agent</h3>
                  <p>Writes production-grade TypeScript & Python code, generates unit tests, and verifies syntax.</p>
                  <div class="metric-row"><span>Pull Requests Created:</span> <strong>38</strong></div>
                  <div class="metric-row"><span>Success Rate:</span> <strong>98.1%</strong></div>
                  <button class="action-btn" onclick="alert('Invoking Code Synthesizer...')">Invoke Agent</button>
                </div>
                <div class="app-card">
                  <div class="card-status active">ACTIVE</div>
                  <h3><span>&#128737;</span> Cyber Security Auditor Agent</h3>
                  <p>Scans code diffs for OWASP Top 10 vulnerabilities, hardcoded secrets, and dependency CVEs.</p>
                  <div class="metric-row"><span>Vulns Scanned:</span> <strong>1,204</strong></div>
                  <div class="metric-row"><span>Success Rate:</span> <strong>100%</strong></div>
                  <button class="action-btn" onclick="alert('Invoking Cyber Auditor...')">Invoke Agent</button>
                </div>
              </div>
            `;
          } else if (tabId === 'dag') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#128451;</span> Active Workflow Execution DAG</h3>
                <div style="background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; font-family:monospace; margin-top:15px; color:#38bdf8;">
                  [User Goal Input] &#10140; (Architect Agent) &#10140; [Decompose Plan]<br>
                  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&#10140; (Branch 1: Frontend Synthesizer) &#10140; [React App]<br>
                  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&#10140; (Branch 2: Security Agent) &#10140; [Audit Report]<br>
                  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&#10140; (Merge Gate) &#10140; [Human Review HITL Queue]
                </div>
                <div style="margin-top:20px;">
                  <button class="action-btn" onclick="alert('DAG re-indexed & executed successfully!')">Run DAG Simulation</button>
                </div>
              </div>
            `;
          } else if (tabId === 'hitl') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#9995;</span> Human-In-The-Loop Verification Queue (1 Pending Approval)</h3>
                <div style="background:rgba(234,179,8,0.1); border:1px solid rgba(234,179,8,0.3); border-radius:12px; padding:20px; margin-top:15px;">
                  <h4 style="color:#eab308;">Task #1094: Deploy High-Priority API Gateway Patch</h4>
                  <p style="color:#cbd5e1; margin-top:6px; font-size:14px;">Agent requested approval to modify CORS policy and publish endpoint to production staging environment.</p>
                  <div style="margin-top:15px; display:flex; gap:10px;">
                    <button class="action-btn" style="background:#22c55e;" onclick="alert('Task Approved & Dispatched!')">Approve Task</button>
                    <button class="action-btn" style="background:#ef4444;" onclick="alert('Task Rejected!')">Reject Task</button>
                  </div>
                </div>
              </div>
            `;
          } else if (tabId === 'chat') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#128172;</span> Multi-Agent Orchestration Console</h3>
                <div id="chat-history" style="background:#020617; border:1px solid #1e293b; border-radius:12px; padding:15px; height:250px; overflow-y:auto; margin-top:15px; font-size:14px;">
                  <div style="color:#38bdf8; margin-bottom:8px;">[System]: OmniAgent Orchestrator v2.4 online. 3 agents ready.</div>
                  <div style="color:#a855f7; margin-bottom:8px;">[Architect Agent]: Standing by to receive user execution prompt...</div>
                </div>
                <div style="display:flex; gap:10px; margin-top:15px;">
                  <input type="text" id="chat-input" placeholder="Type prompt for multi-agent swarm..." style="flex:1; padding:12px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:#fff;">
                  <button class="action-btn" onclick="sendChat()">Send to Swarm</button>
                </div>
              </div>
            `;
          }
        }
        function sendChat() {
          const input = document.getElementById('chat-input');
          const history = document.getElementById('chat-history');
          if (input.value.trim() !== '') {
            history.innerHTML += `<div style="color:#fff; margin-bottom:8px;"><strong>You:</strong> ${input.value}</div>`;
            history.innerHTML += `<div style="color:#38bdf8; margin-bottom:8px;"><strong>[OmniAgent Swarm]:</strong> Processing request "${input.value}" across Architect and Code Synthesizer agents...</div>`;
            input.value = '';
            history.scrollTop = history.scrollHeight;
          }
        }
        

    function switchTab(tabId) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const activeBtn = document.getElementById('tab-btn-' + tabId);
      if (activeBtn) activeBtn.classList.add('active');
      renderTab(tabId);
    }

    // Default to first tab
    document.addEventListener('DOMContentLoaded', () => {
      const firstTab = 'agents';
      switchTab(firstTab);
    });
  </script>
</body>
</html>
