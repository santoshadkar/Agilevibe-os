<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISO 27001 Readiness Portal — ISMS Audit & Compliance Matrix | Santoshanand Adkar Ecosystem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header-banner {
      background: linear-gradient(90deg, #0f172a, #1e1b4b);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .header-banner .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .header-banner .brand-title {
      color: #38bdf8;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }
    .header-banner .return-btn {
      padding: 8px 18px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
    }
    .header-banner .return-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
    }
    .app-layout {
      max-width: 1200px;
      width: 92%;
      margin: 30px auto;
      flex: 1;
    }
    .hero-section {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .hero-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
    }
    .hero-icon {
      font-size: 40px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }
    .hero-sub {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 6px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .nav-tab {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .nav-tab.active, .nav-tab:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .app-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .app-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      color: #fff;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-status {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-status.active {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .action-btn {
      margin-top: 16px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <header class="header-banner">
    <div class="brand">
      <span>&#9889; Santoshanand Adkar Master Ecosystem</span>
      <span style="opacity:0.4;">|</span>
      <span class="brand-title">ISO 27001:2022 ISMS Audit & Compliance Center</span>
    </div>
    <a href="../index.html" class="return-btn">
      <span>&#127968;</span> Return to Main Portfolio
    </a>
  </header>

  <main class="app-layout">
    <section class="hero-section">
      <div class="hero-top">
        <div class="hero-icon">&#128272;</div>
        <div class="hero-title">
          <span class="badge">InfoSec Audit</span>
          <h1>ISO 27001:2022 ISMS Audit & Compliance Center</h1>
        </div>
      </div>
      <p class="hero-sub">Assess controls across 4 main themes (Organizational, People, Physical, Technological) and generate audit gap reports.</p>
    </section>

    <nav class="nav-tabs">
      <button class="nav-tab" id="tab-btn-checklist" onclick="switchTab('checklist')">&#9745; Annex A Control Matrix</button>
<button class="nav-tab" id="tab-btn-radar" onclick="switchTab('radar')">&#128202; Compliance Score</button>
<button class="nav-tab" id="tab-btn-export" onclick="switchTab('export')">&#128196; Audit Report Generator</button>

    </nav>

    <section id="app-content">
      <!-- Dynamic interactive tab content rendered by JS -->
    </section>
  </main>

  <script>
    
        function renderTab(tabId) {
          const content = document.getElementById('app-content');
          if (tabId === 'checklist') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#9745;</span> Annex A Controls Self-Assessment (93 Controls)</h3>
                <div style="margin-top:15px;">
                  <div style="background:#020617; border:1px solid #1e293b; padding:15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                      <strong style="color:#fff;">A.5.1 Policies for Information Security</strong>
                      <p style="color:#94a3b8; font-size:13px;">Information security policy defined, approved by executive management, and published.</p>
                    </div>
                    <span class="badge" style="background:rgba(34,197,94,0.2); color:#22c55e;">COMPLIANT</span>
                  </div>
                  <div style="background:#020617; border:1px solid #1e293b; padding:15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                      <strong style="color:#fff;">A.8.9 Configuration Management</strong>
                      <p style="color:#94a3b8; font-size:13px;">Configurations including security configurations of hardware, software, services defined and monitored.</p>
                    </div>
                    <span class="badge" style="background:rgba(234,179,8,0.2); color:#eab308;">IN PROGRESS</span>
                  </div>
                  <div style="background:#020617; border:1px solid #1e293b; padding:15px; border-radius:12px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                      <strong style="color:#fff;">A.8.28 Secure Coding</strong>
                      <p style="color:#94a3b8; font-size:13px;">Secure coding principles applied to software development pipelines.</p>
                    </div>
                    <span class="badge" style="background:rgba(34,197,94,0.2); color:#22c55e;">COMPLIANT</span>
                  </div>
                </div>
              </div>
            `;
          } else if (tabId === 'radar') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#128202;</span> Overall ISMS Readiness: 91.4%</h3>
                <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:15px; margin-top:20px; text-align:center;">
                  <div style="background:#020617; border:1px solid #1e293b; padding:15px; border-radius:12px;">
                    <div style="font-size:24px; color:#38bdf8; font-weight:800;">37 / 37</div>
                    <div style="color:#94a3b8; font-size:12px; margin-top:4px;">Organizational</div>
                  </div>
                  <div style="background:#020617; border:1px solid #1e293b; padding:15px; border-radius:12px;">
                    <div style="font-size:24px; color:#22c55e; font-weight:800;">8 / 8</div>
                    <div style="color:#94a3b8; font-size:12px; margin-top:4px;">People Controls</div>
                  </div>
                  <div style="background:#020617; border:1px solid #1e293b; padding:15px; border-radius:12px;">
                    <div style="font-size:24px; color:#22c55e; font-weight:800;">14 / 14</div>
                    <div style="color:#94a3b8; font-size:12px; margin-top:4px;">Physical Controls</div>
                  </div>
                  <div style="background:#020617; border:1px solid #1e293b; padding:15px; border-radius:12px;">
                    <div style="font-size:24px; color:#eab308; font-weight:800;">30 / 34</div>
                    <div style="color:#94a3b8; font-size:12px; margin-top:4px;">Technological</div>
                  </div>
                </div>
              </div>
            `;
          } else if (tabId === 'export') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#128196;</span> Executive Statement of Applicability (SoA) Generator</h3>
                <p style="color:#cbd5e1; font-size:14px; margin-bottom:15px;">Export full ISO 27001 readiness report with control justifications and auditor signature block.</p>
                <button class="action-btn" onclick="alert('ISO 27001 Audit Readiness PDF generated successfully!')">Export SoA Audit PDF</button>
              </div>
            `;
          }
        }
        

    function switchTab(tabId) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const activeBtn = document.getElementById('tab-btn-' + tabId);
      if (activeBtn) activeBtn.classList.add('active');
      renderTab(tabId);
    }

    // Default to first tab
    document.addEventListener('DOMContentLoaded', () => {
      const firstTab = 'checklist';
      switchTab(firstTab);
    });
  </script>
</body>
</html>
