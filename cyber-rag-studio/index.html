<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberSec RAG Studio — Threat Intelligence & Vector Search Platform | Santoshanand Adkar Ecosystem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header-banner {
      background: linear-gradient(90deg, #0f172a, #1e1b4b);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .header-banner .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .header-banner .brand-title {
      color: #38bdf8;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }
    .header-banner .return-btn {
      padding: 8px 18px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
    }
    .header-banner .return-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
    }
    .app-layout {
      max-width: 1200px;
      width: 92%;
      margin: 30px auto;
      flex: 1;
    }
    .hero-section {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .hero-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
    }
    .hero-icon {
      font-size: 40px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }
    .hero-sub {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 6px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .nav-tab {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .nav-tab.active, .nav-tab:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .app-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .app-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      color: #fff;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-status {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-status.active {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .action-btn {
      margin-top: 16px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <header class="header-banner">
    <div class="brand">
      <span>&#9889; Santoshanand Adkar Master Ecosystem</span>
      <span style="opacity:0.4;">|</span>
      <span class="brand-title">Cybersecurity Threat Intelligence RAG Engine</span>
    </div>
    <a href="../index.html" class="return-btn">
      <span>&#127968;</span> Return to Main Portfolio
    </a>
  </header>

  <main class="app-layout">
    <section class="hero-section">
      <div class="hero-top">
        <div class="hero-icon">&#128737;</div>
        <div class="hero-title">
          <span class="badge">Security AI</span>
          <h1>Cybersecurity Threat Intelligence RAG Engine</h1>
        </div>
      </div>
      <p class="hero-sub">Dense + BM25 hybrid retrieval, MITRE ATT&CK vector search, and automated incident analysis.</p>
    </section>

    <nav class="nav-tabs">
      <button class="nav-tab" id="tab-btn-query" onclick="switchTab('query')">&#128065; Threat Query Engine</button>
<button class="nav-tab" id="tab-btn-mitre" onclick="switchTab('mitre')">&#128737; MITRE ATT&CK Index</button>
<button class="nav-tab" id="tab-btn-arena" onclick="switchTab('arena')">&#129307; LLM vs SLM Arena</button>
<button class="nav-tab" id="tab-btn-audio" onclick="switchTab('audio')">&#127911; Audio Podcast Overview</button>

    </nav>

    <section id="app-content">
      <!-- Dynamic interactive tab content rendered by JS -->
    </section>
  </main>

  <script>
    
        function renderTab(tabId) {
          const content = document.getElementById('app-content');
          if (tabId === 'query') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#128065;</span> Hybrid Vector + BM25 Threat Retrieval</h3>
                <p style="color:#94a3b8; font-size:14px; margin-bottom:15px;">Search over 50,000 indexed security advisories, CVE reports, and OWASP Top 10 guidelines.</p>
                <div style="display:flex; gap:10px;">
                  <input type="text" id="rag-query" value="T1059.001 PowerShell Command Execution Anomaly" style="flex:1; padding:12px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:#fff;">
                  <button class="action-btn" onclick="runRagQuery()">Search Vector DB</button>
                </div>
                <div id="rag-results" style="margin-top:20px;">
                  <div style="background:rgba(56,189,248,0.1); border:1px solid rgba(56,189,248,0.3); border-radius:12px; padding:16px; margin-bottom:10px;">
                    <div style="display:flex; justify-space-between; align-items:center;">
                      <strong style="color:#38bdf8;">[Score: 0.964] CVE-2024-21413 Microsoft Outlook Remote Code Execution</strong>
                      <span class="badge">Dense Embeddings</span>
                    </div>
                    <p style="color:#cbd5e1; font-size:13px; margin-top:8px;">Attacker bypasses Protected View using malicious hyperlink in email body leading to NTLM credential leak.</p>
                  </div>
                  <div style="background:rgba(99,102,241,0.1); border:1px solid rgba(99,102,241,0.3); border-radius:12px; padding:16px;">
                    <div style="display:flex; justify-space-between; align-items:center;">
                      <strong style="color:#818cf8;">[Score: 0.912] MITRE ATT&CK Technique T1059: Command and Scripting Interpreter</strong>
                      <span class="badge">BM25 Match</span>
                    </div>
                    <p style="color:#cbd5e1; font-size:13px; margin-top:8px;">Adversaries execute commands via PowerShell, CMD, or bash to execute arbitrary system payload code.</p>
                  </div>
                </div>
              </div>
            `;
          } else if (tabId === 'mitre') {
            content.innerHTML = `
              <div class="card-grid">
                <div class="app-card">
                  <h3>Initial Access (TA0001)</h3>
                  <p>Phishing, Exploit Public-Facing Application, Supply Chain Compromise.</p>
                  <div class="metric-row"><span>Indexed Vectors:</span> <strong>1,420</strong></div>
                </div>
                <div class="app-card">
                  <h3>Execution (TA0002)</h3>
                  <p>PowerShell, Windows Management Instrumentation (WMI), Container Administration.</p>
                  <div class="metric-row"><span>Indexed Vectors:</span> <strong>2,850</strong></div>
                </div>
                <div class="app-card">
                  <h3>Exfiltration (TA0010)</h3>
                  <p>Exfiltration Over Web Service, Encrypted Channel, Automated Exfiltration.</p>
                  <div class="metric-row"><span>Indexed Vectors:</span> <strong>980</strong></div>
                </div>
              </div>
            `;
          } else if (tabId === 'arena') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#129307;</span> LLM vs Edge SLM Benchmark Arena</h3>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:15px;">
                  <div style="background:#020617; border:1px solid #1e293b; padding:15px; border-radius:12px;">
                    <h4 style="color:#38bdf8;">Cloud LLM (Claude 3.5 Sonnet / GPT-4o)</h4>
                    <p style="color:#cbd5e1; font-size:13px; margin-top:6px;">Latency: 1,200ms | Accuracy: 98.6% | Context: 128k</p>
                    <p style="color:#94a3b8; font-size:12px; margin-top:10px;">Ideal for complex multi-step threat attribution and root-cause postmortem analysis.</p>
                  </div>
                  <div style="background:#020617; border:1px solid #1e293b; padding:15px; border-radius:12px;">
                    <h4 style="color:#a855f7;">On-Device SLM (Phi-3 Mini / Gemma 2B)</h4>
                    <p style="color:#cbd5e1; font-size:13px; margin-top:6px;">Latency: 85ms | Accuracy: 91.2% | Context: 8k</p>
                    <p style="color:#94a3b8; font-size:12px; margin-top:10px;">Ideal for offline endpoint threat detection, zero data exfiltration compliance, and edge SOC firewalls.</p>
                  </div>
                </div>
              </div>
            `;
          } else if (tabId === 'audio') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#127911;</span> NotebookLLM Audio Overview Podcast Synthesizer</h3>
                <p style="color:#cbd5e1; font-size:14px;">Generate an AI dual-host audio briefing based on uploaded security threat documents.</p>
                <div style="background:#020617; border:1px solid #1e293b; padding:20px; border-radius:12px; margin-top:15px; text-align:center;">
                  <div style="font-size:36px; margin-bottom:10px;">&#127911;</div>
                  <strong style="color:#38bdf8; font-size:16px;">Episode #42: Weekly Cyber Threat Roundup & RAG Security</strong>
                  <p style="color:#94a3b8; font-size:13px; margin-top:4px;">Hosts: Alex & Sam (AI Voice Duo) | Duration: 6 mins</p>
                  <button class="action-btn" style="margin-top:15px;" onclick="alert('Playing synthesized audio briefing...')">&#9654; Play Audio Briefing</button>
                </div>
              </div>
            `;
          }
        }
        function runRagQuery() {
          alert('Vector similarity search complete! Found 2 relevant documents with > 90% cosine similarity.');
        }
        

    function switchTab(tabId) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const activeBtn = document.getElementById('tab-btn-' + tabId);
      if (activeBtn) activeBtn.classList.add('active');
      renderTab(tabId);
    }

    // Default to first tab
    document.addEventListener('DOMContentLoaded', () => {
      const firstTab = 'query';
      switchTab(firstTab);
    });
  </script>
</body>
</html>
