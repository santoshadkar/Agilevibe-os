<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Research Papers Repository — Executive Portal | Santoshanand Adkar Ecosystem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header-banner {
      background: linear-gradient(90deg, #0f172a, #1e1b4b);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .header-banner .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .header-banner .brand-title {
      color: #38bdf8;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }
    .header-banner .return-btn {
      padding: 8px 18px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
    }
    .header-banner .return-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
    }
    .app-layout {
      max-width: 1200px;
      width: 92%;
      margin: 30px auto;
      flex: 1;
    }
    .hero-section {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .hero-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
    }
    .hero-icon {
      font-size: 40px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }
    .hero-sub {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 6px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .nav-tab {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .nav-tab.active, .nav-tab:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .app-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .app-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      color: #fff;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-status {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-status.active {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .action-btn {
      margin-top: 16px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <header class="header-banner">
    <div class="brand">
      <span>&#9889; Santoshanand Adkar Master Ecosystem</span>
      <span style="opacity:0.4;">|</span>
      <span class="brand-title">AI Research Papers Repository Command Center</span>
    </div>
    <a href="../index.html" class="return-btn">
      <span>&#127968;</span> Return to Main Portfolio
    </a>
  </header>

  <main class="app-layout">
    <section class="hero-section">
      <div class="hero-top">
        <div class="hero-icon">&#128300;</div>
        <div class="hero-title">
          <span class="badge">Research Hub</span>
          <h1>AI Research Papers Repository Command Center</h1>
        </div>
      </div>
      <p class="hero-sub">Interactive enterprise application for AI Research Papers Repository. Designed & engineered by Santoshanand Adkar.</p>
    </section>

    <nav class="nav-tabs">
      <button class="nav-tab" id="tab-btn-overview" onclick="switchTab('overview')">&#9889; Interactive Dashboard</button>
<button class="nav-tab" id="tab-btn-analytics" onclick="switchTab('analytics')">&#128200; Live Metrics & Analytics</button>
<button class="nav-tab" id="tab-btn-tools" onclick="switchTab('tools')">&#9881; Tooling & Action Center</button>

    </nav>

    <section id="app-content">
      <!-- Dynamic interactive tab content rendered by JS -->
    </section>
  </main>

  <script>
    
        function renderTab(tabId) {
          const content = document.getElementById('app-content');
          if (tabId === 'overview') {
            content.innerHTML = `
              <div class="card-grid">
                <div class="app-card">
                  <div class="card-status active">ONLINE</div>
                  <h3><span>&#128300;</span> AI Research Papers Repository Core Module</h3>
                  <p style="color:#94a3b8; font-size:14px;">Enterprise-grade capabilities with real-time data processing and modular workflow integration.</p>
                  <div class="metric-row"><span>System Status:</span> <strong style="color:#22c55e;">Operational</strong></div>
                  <div class="metric-row"><span>Uptime SLA:</span> <strong>99.99%</strong></div>
                  <button class="action-btn" onclick="alert('Running operational health check...')">Run Health Check</button>
                </div>
                <div class="app-card">
                  <div class="card-status active">ACTIVE</div>
                  <h3><span>&#128640;</span> AI & Automation Engine</h3>
                  <p style="color:#94a3b8; font-size:14px;">Automated reasoning pipelines, prompt engineering models, and analytics telemetry.</p>
                  <div class="metric-row"><span>Execution Speed:</span> <strong>&lt; 120ms</strong></div>
                  <button class="action-btn" onclick="alert('Triggering AI workflow execution...')">Execute Workflow</button>
                </div>
              </div>
            `;
          } else if (tabId === 'analytics') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#128200;</span> Real-Time Analytics & Performance Metrics</h3>
                <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin-top:20px; text-align:center;">
                  <div style="background:#020617; border:1px solid #1e293b; padding:20px; border-radius:12px;">
                    <div style="font-size:28px; color:#38bdf8; font-weight:800;">26+ Yrs</div>
                    <div style="color:#94a3b8; font-size:12px; margin-top:4px;">Domain Excellence</div>
                  </div>
                  <div style="background:#020617; border:1px solid #1e293b; padding:20px; border-radius:12px;">
                    <div style="font-size:28px; color:#22c55e; font-weight:800;">36+ AI Systems</div>
                    <div style="color:#94a3b8; font-size:12px; margin-top:4px;">Master Ecosystem</div>
                  </div>
                  <div style="background:#020617; border:1px solid #1e293b; padding:20px; border-radius:12px;">
                    <div style="font-size:28px; color:#a855f7; font-weight:800;">SAFe 6.0 RTE</div>
                    <div style="color:#94a3b8; font-size:12px; margin-top:4px;">Barclays VP Standard</div>
                  </div>
                </div>
              </div>
            `;
          } else if (tabId === 'tools') {
            content.innerHTML = `
              <div class="app-card">
                <h3><span>&#9881;</span> Action & Configuration Center</h3>
                <p style="color:#cbd5e1; font-size:14px; margin-bottom:15px;">Configure parameters, trigger batch processing, and export diagnostic logs.</p>
                <div style="display:flex; gap:12px;">
                  <button class="action-btn" onclick="alert('Exporting system telemetry logs...')">Export Logs</button>
                  <button class="action-btn" style="background:rgba(255,255,255,0.05); border:1px solid #334155;" onclick="alert('System settings synced!')">Sync Settings</button>
                </div>
              </div>
            `;
          }
        }
        

    function switchTab(tabId) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const activeBtn = document.getElementById('tab-btn-' + tabId);
      if (activeBtn) activeBtn.classList.add('active');
      renderTab(tabId);
    }

    // Default to first tab
    document.addEventListener('DOMContentLoaded', () => {
      const firstTab = 'overview';
      switchTab(firstTab);
    });
  </script>
</body>
</html>
