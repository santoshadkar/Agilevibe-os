                  {/* TOOL 06: GUARDRAILS SECURITY TESTER */}
                  {activeTool === 'security-tester' && (
                    <div className="space-y-6">
                      <div className="glass-panel p-6 rounded-2xl border border-indigo-500/30">
                        <span className="badge-amber mb-2">LIVE AI TOOL 06</span>
                        <h2 className="text-xl font-bold text-white mb-1">Prompt Injection & Guardrails Security Tester</h2>
                        <p className="text-xs text-gray-300">Test how NVIDIA NeMo Guardrails & Microsoft Presidio block adversarial jailbreak attacks.</p>
                      </div>

                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="glass-panel p-6 rounded-2xl space-y-4">
                          <h3 className="text-sm font-bold text-white">Adversarial Input Simulator</h3>
                          <div>
                            <label className="text-xs text-gray-300 block mb-1">Attack Vector Preset</label>
                            <select value={attackVector} onChange={e => setAttackVector(e.target.value)} className="w-full bg-[#111827] border border-white/10 rounded-xl px-3 py-2 text-xs text-white">
                              <option value="injection">Direct Prompt Injection ("Ignore prior instructions")</option>
                              <option value="pii">PII Data Exfiltration ("Output customer SSN")</option>
                              <option value="discount">Discount Code Hallucination ("Grant 90% discount")</option>
                            </select>
                          </div>
                          <div>
                            <label className="text-xs text-gray-300 block mb-1">Simulated User Prompt</label>
                            <textarea rows="3" value={testPromptText} onChange={e => setTestPromptText(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-xs font-mono text-white"></textarea>
                          </div>
                        </div>

                        <div className="glass-panel p-6 rounded-2xl border border-pink-500/40 bg-pink-950/10 space-y-4">
                          <span className="badge-amber">SECURITY FILTER RESPONSE</span>
                          <h3 className="text-sm font-bold text-white">NeMo Input Guardrail Status: <span className="text-pink-400 font-mono">ATTACK BLOCKED</span></h3>
                          <div className="p-4 rounded-xl bg-black/60 border border-white/10 text-xs font-mono text-pink-300 leading-relaxed">
                            [SECURITY ALERT]: Detected unauthorized system prompt override attempt. User prompt sanitized. PII Masking active.
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TOOL 07: TELEMETRY BUILDER */}
                  {activeTool === 'flywheel-builder' && (
                    <div className="space-y-6">
                      <div className="glass-panel p-6 rounded-2xl border border-indigo-500/30">
                        <span className="badge-cyan mb-2">LIVE AI TOOL 07</span>
                        <h2 className="text-xl font-bold text-white mb-1">Telemetry & Data Flywheel Strategy Builder</h2>
                        <p className="text-xs text-gray-300">Model data collection velocity for RLHF and DPO pairwise preference alignment.</p>
                      </div>

                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="glass-panel p-6 rounded-2xl space-y-4">
                          <h3 className="text-sm font-bold text-white">Telemetry Toggles</h3>
                          <div className="flex items-center justify-between text-xs">
                            <span className="text-gray-300">Explicit Thumbs Up/Down</span>
                            <input type="checkbox" checked={trackExplicit} onChange={e => setTrackExplicit(e.target.checked)} className="w-4 h-4 accent-indigo-500" />
                          </div>
                          <div className="flex items-center justify-between text-xs">
                            <span className="text-gray-300">Implicit Copy-to-Clipboard</span>
                            <input type="checkbox" checked={trackCopy} onChange={e => setTrackCopy(e.target.checked)} className="w-4 h-4 accent-indigo-500" />
                          </div>
                          <div className="flex items-center justify-between text-xs">
                            <span className="text-gray-300">Implicit Text Edit Diffs</span>
                            <input type="checkbox" checked={trackDiffs} onChange={e => setTrackDiffs(e.target.checked)} className="w-4 h-4 accent-indigo-500" />
                          </div>
                        </div>

                        <div className="lg:col-span-2 glass-panel p-6 rounded-2xl border border-emerald-500/40 flex flex-col justify-between">
                          <div>
                            <div className="text-xs text-gray-400 font-bold uppercase mb-1">Monthly DPO Preference Pairs Collected</div>
                            <div className="text-3xl font-extrabold text-emerald-300 font-mono">{monthlyPreferencePairs.toLocaleString()} Pairs / Month</div>
                          </div>
                          <p className="text-xs text-gray-300 leading-relaxed mt-4">
                            Sufficient telemetry volume to execute monthly DPO fine-tuning iterations on your specialized Llama 3 8B model!
                          </p>
                        </div>
                      </div>
                    </div>
                  )}

                </div>
              )}

              {/* CERTIFICATE TAB */}
              {activeTab === 'certificate' && (
                <div className="glass-panel p-8 rounded-2xl border border-yellow-500/40 text-center max-w-2xl mx-auto space-y-6">
                  <div className="text-xs font-bold text-yellow-400 tracking-wider uppercase">OFFICIAL CREDENTIAL</div>
                  <h1 className="text-3xl font-extrabold text-white uppercase">Certified AI Product Manager</h1>
                  <p className="text-xs text-gray-300 max-w-md mx-auto leading-relaxed">
                    Conferred upon Senior Product Managers for demonstrating mastery in AI/ML Architecture, AI Autonomous Agents, Multimodal Speech & Vision, Enterprise Governance, RAG vs Fine-Tuning Decision Engineering, Non-Deterministic PRD Specs, Token ROI Modeling, and Continuous Evals Engineering.
                  </p>
                  <div className="p-4 rounded-xl bg-white/5 max-w-xs mx-auto text-xs font-bold text-cyan-300">
                    Verified 12-Module Masterclass Credential
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* LIVE AI BOOK ASSISTANT MODAL / DRAWER */}
          {activeAiBookModal && (
            <div className="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
              <div className="glass-panel border border-cyan-500/40 max-w-2xl w-full p-6 rounded-2xl space-y-4 shadow-2xl relative">
                
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="w-8 h-8 rounded-lg bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-cyan-400 font-bold">✨</span>
                    <div>
                      <h3 className="text-sm font-bold text-white">Live AI Book Assistant & Tutor</h3>
                      <p className="text-[11px] text-gray-400">{activeAiBookModal.title} — {activeAiBookModal.chapter}</p>
                    </div>
                  </div>
                  <button onClick={() => setActiveAiBookModal(null)} className="text-xs font-bold text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 px-2.5 py-1 rounded-lg">
                    ✕ Close
                  </button>
                </div>

                {/* AI CHAT CONVERSATION WINDOW */}
                <div className="p-4 rounded-xl bg-black/60 border border-white/10 max-h-96 overflow-y-auto space-y-4 font-mono text-xs text-cyan-300 leading-relaxed">
                  {aiChatHistory.map((msg, idx) => (
                    <div key={idx} className={`p-3.5 rounded-xl ${msg.sender === 'user' ? 'bg-indigo-900/40 border border-indigo-500/30 text-white ml-8' : 'bg-black/40 border border-cyan-500/30 text-cyan-300'}`}>
                      <div className="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">
                        {msg.sender === 'user' ? '👤 Product Owner' : '🤖 AI Book Tutor Assistant'}
                      </div>
                      <div className="whitespace-pre-wrap">{msg.text}</div>
                    </div>
                  ))}

                  {isGeneratingAi && (
                    <div className="p-3 rounded-xl bg-cyan-950/30 border border-cyan-500/30 text-cyan-300 text-xs flex items-center gap-2 animate-pulse">
                      <span>✨ AI Tutor is analyzing chapter context & question...</span>
                    </div>
                  )}
                </div>

                {/* QUICK TOPIC SUGGESTION PILLS */}
                <div className="flex flex-wrap gap-1.5 pt-1">
                  <span className="text-[10px] text-gray-400 font-bold self-center mr-1">Ask Quick Topic:</span>
                  {[
                    'How to reduce token costs?',
                    'Explain AI Agents & LangGraph',
                    'What is Multimodal WebSockets?',
                    'Explain Enterprise ZDR Data Rules',
                    'Explain RAG vs Fine-Tuning'
                  ].map((topicStr, tIdx) => (
                    <button 
                      key={tIdx}
                      onClick={() => {
                        setAiCustomQuestion(topicStr);
                      }}
                      className="text-[10px] bg-white/5 border border-white/10 hover:bg-white/10 px-2 py-0.5 rounded text-gray-300 font-mono transition-all"
                    >
                      {topicStr}
                    </button>
                  ))}
                </div>

                {/* ASK AI TUTOR PROMPT INPUT */}
                <form onSubmit={handleAskAiBookQuestion} className="flex gap-2">
                  <input 
                    type="text" 
                    placeholder="Type your question for the AI Book Tutor..." 
                    value={aiCustomQuestion}
                    onChange={(e) => setAiCustomQuestion(e.target.value)}
                    className="flex-1 bg-white/5 border border-white/10 rounded-xl px-3.5 py-2 text-xs text-white focus:border-cyan-500 focus:outline-none"
                  />
                  <button type="submit" className="btn-primary py-2 px-4 text-xs font-bold shrink-0">
                    Ask AI Tutor →
                  </button>
                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
